<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simplified ChurchSuite staff guide for Christ the King Parish Dartmouth."
    />
    <title>ChurchSuite Simplified | CTK Dartmouth</title>
    <script>
      try {
        const theme = localStorage.getItem("ctk-guide-theme");
        if (theme === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

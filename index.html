<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simplified ChurchSuite staff guide for Christ the King Parish Dartmouth."
    />
    <title>ChurchSuite Simplified | CTK Dartmouth</title>
  </head>
  <body>
    <form name="site-feedback" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="site-feedback" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="kind" />
      <input name="page" />
      <input name="page-url" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
